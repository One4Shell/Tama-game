            }

            drawPixelFood(x, y) {
                this.drawPixelSprite(this.SPRITES.FEED, x, y, 2);
            }

            drawBroom(x, y) {
                this.drawPixelSprite(this.SPRITES.CLEAN, x, y, 2);
            }

            drawSkull(x, y) {
                this.drawPixelSprite(this.SPRITES.SKULL, x, y, 1);
            }

            drawPixelSprite(map, x, y, scale = 2, dark = '#1f2a08', mid = '#526333', light = '#879864') {
                const c = this.ctx;
                for (let r = 0; r < map.length; r++) {
                    const row = map[r];
                    for (let col = 0; col < row.length; col++) {
                        const ch = row[col];
                        if (ch === '.') continue;
                        c.fillStyle = ch === '#' ? dark : (ch === '-' ? light : mid);
                        c.fillRect(x + col * scale, y + r * scale, scale, scale);
                    }
                }
            }

            drawStatIcons() {
                const map = {
                    iconHunger: this.SPRITES.FEED,
                    iconHappy: this.SPRITES.PLAY,
                    iconEnergy: this.SPRITES.SLEEP,
                    iconHygiene: this.SPRITES.CLEAN
                };
                const size = 22;
                const dark = '#1f2a08';
                const mid = '#526333';
                const light = '#879864';
                Object.entries(map).forEach(([id, sprite]) => {
                    const cvs = document.getElementById(id);
                    if (!cvs || !sprite) return;
                    const ctx = cvs.getContext('2d');
                    ctx.clearRect(0, 0, size, size);
                    const s = size / sprite.length;
                    for (let r = 0; r < sprite.length; r++) {
                        for (let c = 0; c < sprite[r].length; c++) {
                            const ch = sprite[r][c];
                            if (ch === '.') continue;
                            ctx.fillStyle = ch === '#' ? dark : (ch === '-' ? light : mid);
                            ctx.fillRect(Math.floor(c * s), Math.floor(r * s), Math.ceil(s), Math.ceil(s));
                        }
                    }
                });
            }

            isMenuActionAvailable(item) {
                const pet = this.getActivePet();
                if (!pet) return false;
                const checks = {
                    MIC: p => p.canAct() && !!(this.speechRecognizer && this.speechRecognizer.isSupported()),
                    FEED: p => p.canFeed(),
                    PLAY: p => p.canPlay(),
                    CLEAN: p => p.canClean(),
                    SLEEP: p => p.canSleep(),
                    HEAL: p => p.canHeal() && this.coins >= 80
                };
                return checks[item](pet);
            }

            moveMenuIndex(dir) {
                const len = this.MENU_ITEMS.length;
                for (let i = 1; i <= len; i++) {
                    const idx = ((this.menuIndex + dir * i) % len + len) % len;
                    if (this.isMenuActionAvailable(this.MENU_ITEMS[idx])) {
                        this.menuIndex = idx;
                        return true;
                    }
                }
                return false;
            }

            normalizeMenuSelection() {
                if (!this.isMenuActionAvailable(this.MENU_ITEMS[this.menuIndex])) {
                    this.moveMenuIndex(1);
                }
            }

            getMenuIconLayout() {
                const W = this.canvas.width;
                const vs = this.canvas.height / 180;
                const edgeMargin = 22;
                const innerW = W - 2 * edgeMargin;
                const spriteScale = Math.max(2, Math.min(6, Math.round(2 * vs), Math.floor(innerW / (this.MENU_ITEMS.length * 16))));
                const icon = 16 * spriteScale;
                const cell = Math.max(icon + 6, Math.floor(innerW / this.MENU_ITEMS.length));
                const startX = edgeMargin + (innerW - this.MENU_ITEMS.length * cell) / 2;
                const y = edgeMargin;
                const hlH = Math.round(icon * 42 / 32);
                return this.MENU_ITEMS.map((item, i) => {
                    const x = startX + i * cell + (cell - icon) / 2;
                    return {
                        item, i, x, y,
                        width: cell,
                        height: hlH,
                        icon,
                        spriteScale,
                        cell,
                        available: this.isMenuActionAvailable(item),
                        selected: this.menuOpen && this.isMenuActionAvailable(item) && i === this.menuIndex
                    };
                });
            }

            drawMenuIcons() {
                this.getMenuIconLayout().forEach(({ item, x, y, icon, spriteScale, cell, available, selected }) => {
                    const micActive = item === 'MIC' && this.isListening;

                    if (selected || micActive) {
                        this.ctx.fillStyle = micActive ? '#dc2626' : '#1f2a08';
                        this.ctx.fillRect(x - 4, y - 5, cell - 1, Math.round(icon * 42 / 32));
                    }

                    this.ctx.save();
                    if (!available) this.ctx.globalAlpha = 0.3;

                    this.drawPixelSprite(this.SPRITES[item], x, y, spriteScale,
                        selected ? '#879864' : '#1f2a08',
                        '#526333',
                        selected ? '#1f2a08' : '#879864');
                    this.ctx.restore();

                    if (item === 'HEAL') {
                        const k = spriteScale / 2;
                        this.ctx.fillStyle = '#526333';
                        this.ctx.fillRect(x + 22 * k, y + 26 * k, 24 * k, 11 * k);
                        this.ctx.fillStyle = '#879864';
                        this.ctx.font = 'bold ' + Math.round(8 * k) + 'px monospace';
                        this.ctx.fillText('$80', x + 24 * k, y + 35 * k);
                    }
                });
            }

            // Click sul display: traduce le coordinate e agisce in base alla schermata
            handleCanvasClick(e) {
                if (!this.isOpen) return;
                if (!document.getElementById('overlayModal').classList.contains('hidden')) return;

                const rect = this.canvas.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * this.canvas.width;
                const y = ((e.clientY - rect.top) / rect.height) * this.canvas.height;

                if (this.miniGameActive) {
                    if (this.hitCloseZone(x, y)) {
                        this.miniGameActive = false;
                        this.showModal("GIOCO INTERROTTO", "Hai abbandonato il minigioco.");
                    }
                    return;
                }

                if (this.shopScreenOpen) { this.handleShopClick(x, y); return; }
                if (this.achScreenOpen) { this.handleOverlayNavClick(x, y, 'ach'); return; }
                if (this.treeScreenOpen) { this.handleOverlayNavClick(x, y, 'tree'); return; }

                // Schermata principale: click su un'icona del menu
                const layout = this.getMenuIconLayout();
                for (const slot of layout) {
                    if (x >= slot.x - 4 && x <= slot.x + slot.cell &&
                        y >= slot.y - 5 && y <= slot.y + slot.height + 5) {
                        if (slot.available) {
                            this.menuIndex = slot.i;
                            this.menuOpen = true;
                            audio.playBeep(400, 'square', 0.05);
                            this.handleAction(slot.item);
                        } else {
                            audio.playAlert();
                        }
                        return;
                    }
                }
            }

            hitCloseZone(x, y) {
                const hs = this.canvas.width / 310;
                const vs = this.canvas.height / 180;
                return x > 282 * hs && y < 20 * vs;
            }

            handleShopClick(x, y) {
                const items = this.getShopItems();
                const rows = 5;
                const hs = this.canvas.width / 310;
                const vs = this.canvas.height / 180;

                if (y < 18 * vs) {
                    if (x > 282 * hs) {
                        this.shopScreenOpen = false;
                        audio.playBeep(400, 'square', 0.06);
                        this.updateUI();
                    }
                    return;
                }

                const rowH = 22 * vs;
                const startY = 24 * vs;
                const start = Math.min(Math.max(0, this.shopIndex - rows + 1), Math.max(0, items.length - rows));
                const row = Math.floor((y - startY) / rowH);
                if (row < 0 || row >= rows) return;
                const idx = start + row;
                const item = items[idx];
                if (!item) return;

                if (idx === this.shopIndex) {
                    if (item.type === 'EXIT') {
                        this.shopScreenOpen = false;
                        audio.playBeep(400, 'square', 0.06);
                        this.updateUI();
                    } else {
                        this.shopBuy();
                    }
                } else {
                    this.shopIndex = idx;
                    audio.playBeep(450, 'square', 0.05);
                }
            }

            handleOverlayNavClick(x, y, which) {
                const hs = this.canvas.width / 310;
                const vs = this.canvas.height / 180;
                if (y >= 18 * vs) return;

                const xs = x / hs;
                if (xs >= 240 && xs < 258) {
                    if (which === 'ach') this.achScreenScroll = Math.max(0, this.achScreenScroll - 1);
                    else this.treeScreenScroll = Math.max(0, this.treeScreenScroll - 1);
                    audio.playBeep(350, 'square', 0.05);
                } else if (xs >= 258 && xs < 280) {
                    if (which === 'ach') this.achScreenScroll = Math.min(ACHIEVEMENTS.length - 6, this.achScreenScroll + 1);
                    else this.treeScreenScroll = Math.min(Math.max(0, this.buildTreeRows().length - 6), this.treeScreenScroll + 1);
                    audio.playBeep(450, 'square', 0.05);
                } else if (xs >= 280) {
                    if (which === 'ach') this.achScreenOpen = false;
                    else this.treeScreenOpen = false;
                    audio.playBeep(400, 'square', 0.06);
                    this.updateUI();
                }
            }

            renderMiniGame() {
                const hs = this.canvas.width / 310;
                const vs = this.canvas.height / 180;
                this.ctx.fillStyle = '#1f2a08';
                this.ctx.font = 'bold ' + Math.round(15 * hs) + 'px monospace';
                this.ctx.fillText(`STELLE: ${this.miniGameScore} / 5`, 10 * hs, 20 * vs);

                this.ctx.font = Math.round(24 * hs) + 'px monospace';
                this.ctx.fillText('★', this.starX * hs, this.starY * vs);
                this.ctx.fillRect(this.basketX * hs, 140 * vs, 40 * hs, 10 * vs);

                // Tasto per uscire dal minigioco
                this.drawOverlayNav(this.canvas.width / 310, this.canvas.height / 180, false);
            }

            // Disegna ▲/▼ (scroll) e ✕ (chiudi) nell'header delle schermate overlay
            drawOverlayNav(hs, vs, showScroll) {
                const c = this.ctx;
                c.font = 'bold ' + Math.round(13 * hs) + 'px monospace';
                c.fillStyle = '#879864';
                if (showScroll) {
                    c.fillText('▲', 250 * hs, 13 * vs);
                    c.fillText('▼', 268 * hs, 13 * vs);
                }
                c.fillText('✕', 300 * hs, 13 * vs);
            }

            // ---- SHOP ----

            // Catalogo shop: i toy già posseduti dal pet attivo spariscono dalla lista
            getShopItems() {
                const pet = this.getActivePet();
                const owned = pet && Array.isArray(pet.toys) ? pet.toys : [];
                return [
                    ...Object.keys(TOYS).filter(id => !owned.includes(id))
                        .map(id => ({ type: 'TOY', id, name: TOYS[id].name, price: TOYS[id].price, sprite: TOYS[id].sprite })),
                    { type: 'SNACK', id: 'SNACK', name: 'Snack', price: 40, sprite: getArt('FEED') },
                    { type: 'EXIT', id: 'EXIT', name: 'Esci', price: 0, sprite: null }
                ];
            }

            toggleShop() {
                if (!this.isOpen || this.miniGameActive) return;
                if (!document.getElementById('overlayModal').classList.contains('hidden')) return;
                if (this.achScreenOpen) this.achScreenOpen = false;
                if (this.treeScreenOpen) this.treeScreenOpen = false;

                if (this.shopScreenOpen) {
                    this.shopScreenOpen = false;
                } else {
                    if (!this.getActivePet()) {
                        this.showModal("SHOP", "Nessun pet a cui fare regali!");
                        return;
                    }
                    this.shopScreenOpen = true;
                    this.menuOpen = false;
                    this.shopIndex = 0;
                }
                audio.playBeep(500, 'square', 0.06);
                this.updateUI();
            }

            flashShop(text) {
                this.shopFlash = { text, timer: 110 };
            }

            shopBuy() {
                const items = this.getShopItems();
                const item = items[this.shopIndex];
                if (!item) return;

                if (item.type === 'EXIT') {
                    this.shopScreenOpen = false;
                    audio.playBeep(400, 'square', 0.06);
                    this.updateUI();
                    return;
                }

                const pet = this.getActivePet();
                if (!pet) return;

                if (item.type === 'TOY') {
                    const def = TOYS[item.id];
                    if (this.coins >= def.price) {
                        this.coins -= def.price;
                        pet.toys.push(item.id);
                        // Il toy esce dal catalogo: riclampa la selezione sulla nuova lista
                        this.shopIndex = Math.min(this.shopIndex, this.getShopItems().length - 1);
                        audio.playChime();
                        this.flashShop(`${def.name} assegnato a ${pet.name}!`);
                    } else {
                        audio.playAlert();
                        this.flashShop('Monete insufficienti!');
                    }
                } else if (item.type === 'SNACK') {
                    if (pet.stage === 'EGG') { audio.playAlert(); this.flashShop('È un uovo!'); return; }
                    if (pet.isSleeping) { audio.playAlert(); this.flashShop('Sta dormendo!'); return; }
                    if (this.coins < item.price) { audio.playAlert(); this.flashShop('Monete insufficienti!'); return; }
                    this.coins -= item.price;
                    pet.hunger = Math.min(100, pet.hunger + 30);
                    pet.careStats.feeds++;
                    this.achievements.record('FEED');
                    audio.playBeep(600, 'square', 0.1);
                    this.flashShop('Gnam! Fame +30');
                }

                this.saveGame();
                this.checkAchievements();
                this.updateUI();
            }

            renderShop() {
                const c = this.ctx;
                const items = this.getShopItems();
                const rows = 5;
                const hs = this.canvas.width / 310;
                const vs = this.canvas.height / 180;

                c.fillStyle = '#1f2a08';
                c.fillRect(0, 0, this.canvas.width, 18 * vs);
                c.fillStyle = '#879864';
                c.font = 'bold ' + Math.round(13 * hs) + 'px monospace';
                c.fillText(`SHOP  $ ${Math.floor(this.coins)}`, 8 * hs, 13 * vs);
                c.textAlign = 'right';
                c.fillText(`${this.shopIndex + 1}/${items.length}`, 280 * hs, 13 * vs);
                c.textAlign = 'left';

                const rowH = 22 * vs;
                const startY = 24 * vs;
                const start = Math.min(Math.max(0, this.shopIndex - rows + 1), Math.max(0, items.length - rows));

                for (let i = 0; i < rows; i++) {
                    const idx = start + i;
                    const item = items[idx];
                    if (!item) break;
                    const y = startY + i * rowH;
                    const selected = idx === this.shopIndex;

                    if (selected) {
                        c.fillStyle = 'rgba(31,42,8,0.85)';
                        c.fillRect(0, y - 3 * vs, this.canvas.width, rowH - 2 * vs);
                    }

                    c.fillStyle = selected ? '#879864' : 'rgba(31,42,8,0.18)';
                    c.fillRect(6 * hs, y, 16 * hs, 16 * vs);
                    if (item.sprite) {
                        this.drawPixelSprite(item.sprite, 6 * hs, y, Math.max(1, Math.round(hs)),
                            selected ? '#879864' : '#1f2a08',
                            selected ? '#1f2a08' : '#526333',
                            selected ? '#1f2a08' : '#879864');
                    } else {
                        c.font = 'bold ' + Math.round(13 * hs) + 'px monospace';
                        c.fillStyle = selected ? '#879864' : '#1f2a08';
                        c.fillText('✕', 10 * hs, y + 12 * vs);
                    }

                    c.fillStyle = selected ? '#879864' : '#1f2a08';
                    c.font = 'bold ' + Math.round(13 * hs) + 'px monospace';
                    c.fillText(item.name, 28 * hs, y + 8 * vs);

                    c.font = Math.round(10 * hs) + 'px monospace';
                    let sub = '';
                    if (item.type === 'TOY') {
                        sub = `toy · -${Math.round(TOYS[item.id].bonus * 100)}% calo gioia`;
                    } else if (item.type === 'SNACK') {
                        sub = 'fame +30';
                    } else {
                        sub = 'Tocca per uscire';
                    }
                    c.fillText(sub, 28 * hs, y + 17 * vs);

                    c.font = 'bold ' + Math.round(12 * hs) + 'px monospace';
                    c.textAlign = 'right';
                    c.fillText(item.type === 'EXIT' ? '⏎' : `$${item.price}`, 302 * hs, y + 12 * vs);
                    c.textAlign = 'left';
                }

                this.drawOverlayNav(hs, vs, false);

                if (this.shopFlash) {
                    c.fillStyle = '#1f2a08';
                    c.fillRect(0, 162 * vs, this.canvas.width, 18 * vs);
                    c.fillStyle = '#879864';
                    c.font = 'bold ' + Math.round(12 * hs) + 'px monospace';
                    c.textAlign = 'center';
                    c.fillText(this.shopFlash.text, this.canvas.width / 2, 154 * vs);
                    c.textAlign = 'left';
                }
            }

            renderAchievements() {
                const c = this.ctx;
                const rows = 6;
                const hs = this.canvas.width / 310;
                const vs = this.canvas.height / 180;

                c.fillStyle = '#1f2a08';
                c.fillRect(0, 0, this.canvas.width, 18 * vs);
                c.fillStyle = '#879864';
                c.font = 'bold ' + Math.round(13 * hs) + 'px monospace';
                c.fillText(`TROFEI ${Object.keys(this.achievements.unlocked).length}/${ACHIEVEMENTS.length}`, 8 * hs, 13 * vs);

                const rowH = 22 * vs;
                const startY = 24 * vs;
                for (let i = 0; i < rows; i++) {
                    const def = ACHIEVEMENTS[this.achScreenScroll + i];
                    if (!def) break;
                    const y = startY + i * rowH;
                    const unlocked = this.achievements.isUnlocked(def);

                    c.save();
                    if (!unlocked) c.globalAlpha = 0.55;

                    c.fillStyle = unlocked ? '#526333' : 'rgba(31,42,8,0.18)';
                    c.fillRect(6 * hs, y, 16 * hs, 16 * vs);
                    c.font = Math.round(13 * hs) + 'px monospace';
                    c.fillStyle = '#1f2a08';
                    c.fillText(unlocked ? def.icon : '🔒', 8 * hs, y + 12 * vs);

                    c.font = 'bold ' + Math.round(13 * hs) + 'px monospace';
                    c.fillText(def.title, 28 * hs, y + 8 * vs);
                    c.font = Math.round(10 * hs) + 'px monospace';
                    c.fillText(def.desc, 28 * hs, y + 17 * vs);

                    c.font = 'bold ' + Math.round(12 * hs) + 'px monospace';
                    c.textAlign = 'right';
                    if (unlocked) {
                        c.fillText('✓', 302 * hs, y + 12 * vs);
                    } else {
                        const pr = this.achievements.progressFor(def);
                        c.fillText(`${pr.current}/${pr.target}`, 302 * hs, y + 12 * vs);
                    }
                    c.textAlign = 'left';
                    c.restore();

                    c.fillStyle = 'rgba(31,42,8,0.2)';
                    c.fillRect(6 * hs, y + rowH - 3 * vs, 298 * hs, 1 * vs);
                }

                this.drawOverlayNav(hs, vs, true);
            }

            // Snapshot del pet nell'archivio dinastico prima della rimozione
            archivePet(pet, fate) {
                if (this.petHistory.some(e => e.id === pet.id)) return;
                this.petHistory.push({
                    id: pet.id,
                    name: pet.name,
                    species: pet.species,
                    generation: pet.generation,
                    fate: fate, // 'DEPARTED' | 'DEAD'
                    ageSeconds: Math.floor(pet.ageSeconds),
                    bornAt: pet.bornAt || null,
                    parentName: pet.parentName || null,
                    stats: Object.assign({ feeds: 0, wins: 0, cleans: 0, heals: 0 }, pet.careStats)
                });
            }

            // Righe dell'albero: testate GENERAZIONE (dalla più alta) + pet (archiviati e vivi)
            buildTreeRows() {
                const entries = [
                    ...this.petHistory,
                    ...this.pets.map(p => ({
                        id: p.id,
                        name: p.name,
                        species: p.species,
                        generation: p.generation,
                        fate: p.stage === 'EGG' ? 'EGG' : 'ALIVE',
                        ageSeconds: Math.floor(p.ageSeconds),
                        bornAt: p.bornAt || 0,
                        parentName: p.parentName || null,
                        stats: p.careStats || { feeds: 0, wins: 0, cleans: 0, heals: 0 }
                    }))
                ];

                const gens = [...new Set(entries.map(e => e.generation))].sort((a, b) => b - a);
                const rows = [];
                gens.forEach(g => {
                    rows.push({ type: 'gen', gen: g });
                    entries.filter(e => e.generation === g)
                        .sort((a, b) => (a.bornAt || 0) - (b.bornAt || 0))
                        .forEach(e => rows.push({ type: 'pet', pet: e }));
                });
                return rows;
            }

            renderTree() {
                const c = this.ctx;
                const rows = this.buildTreeRows();
                const visible = 6;
                const maxScroll = Math.max(0, rows.length - visible);
                this.treeScreenScroll = Math.min(this.treeScreenScroll, maxScroll);
                const hs = this.canvas.width / 310;
                const vs = this.canvas.height / 180;

                const totalPets = this.petHistory.length + this.pets.length;
                const maxGen = Math.max(1, ...this.petHistory.map(e => e.generation), ...this.pets.map(p => p.generation));

                c.fillStyle = '#1f2a08';
                c.fillRect(0, 0, this.canvas.width, 18 * vs);
                c.fillStyle = '#879864';
                c.font = 'bold ' + Math.round(13 * hs) + 'px monospace';
                c.fillText(`ALBERO GEN MAX ${maxGen} · ${totalPets} PET`, 8 * hs, 13 * vs);

                const rowH = 22 * vs;
                const startY = 24 * vs;
                const fateIcon = { ALIVE: '♥', DEPARTED: '✈', DEAD: '✝', EGG: '○' };

                for (let i = 0; i < visible; i++) {
                    const row = rows[this.treeScreenScroll + i];
                    if (!row) break;
                    const y = startY + i * rowH;

                    if (row.type === 'gen') {
                        c.fillStyle = 'rgba(31,42,8,0.25)';
                        c.fillRect(0, y, this.canvas.width, 12 * vs);
                        c.fillStyle = '#1f2a08';
                        c.font = 'bold ' + Math.round(12 * hs) + 'px monospace';
                        c.fillText(`— GENERAZIONE ${row.gen} —`, 8 * hs, y + 9 * vs);
                        continue;
                    }

                    const pet = row.pet;

                    // Ritratto: uovo se ancora uovo, altrimenti sprite della specie
                    c.fillStyle = 'rgba(31,42,8,0.18)';
                    c.fillRect(6 * hs, y, 16 * hs, 16 * vs);
                    const sprite = pet.fate === 'EGG' ? this.SPRITES.BREED : (SPECIES[pet.species] || SPECIES.BLOB).sprite;
                    this.drawPixelSprite(sprite, 6 * hs, y, Math.max(1, Math.round(hs)));

                    c.fillStyle = '#1f2a08';
                    c.font = 'bold ' + Math.round(13 * hs) + 'px monospace';
                    c.fillText(pet.name, 28 * hs, y + 8 * vs);

                    c.font = 'bold ' + Math.round(12 * hs) + 'px monospace';
                    c.textAlign = 'right';
                    c.fillText(`${fateIcon[pet.fate] || '?'} ${pet.fate === 'EGG' ? 'attesa' : formatAge(pet.ageSeconds)}`, 302 * hs, y + 8 * vs);
                    c.textAlign = 'left';

                    c.font = Math.round(10 * hs) + 'px monospace';
                    const origin = pet.parentName ? `di ${pet.parentName}` : 'capostipite';
                    c.fillText(`${origin} · 🍖${pet.stats.feeds} ⭐${pet.stats.wins} 🧹${pet.stats.cleans} 💉${pet.stats.heals}`, 28 * hs, y + 17 * vs);

                    c.fillStyle = 'rgba(31,42,8,0.2)';
                    c.fillRect(6 * hs, y + rowH - 3 * vs, 298 * hs, 1 * vs);
                }

                this.drawOverlayNav(hs, vs, true);
            }

            checkAchievements() {
                this.pets.forEach(p => {
                    if (p.stage === 'SENIOR' && !this.seniorSeenIds.has(p.id)) {
                        this.seniorSeenIds.add(p.id);
                        this.achievements.record('SENIOR');
                    }
                });
                this.achievements.sync(this);
                this.achievements.check(this).forEach(def => this.onAchievementUnlocked(def));
            }

            onAchievementUnlocked(def) {
                audio.playUnlock();

                const toast = document.getElementById('achievementToast');
                document.getElementById('achToastIcon').innerText = def.icon;
                document.getElementById('achToastText').innerText = 'SBLOCCATO! ' + def.title.toUpperCase();
                toast.classList.remove('hidden', 'achievement-toast-show');
                void toast.offsetWidth; // riavvia l'animazione
                toast.classList.add('achievement-toast-show');

                if (this.achToastTimeout) clearTimeout(this.achToastTimeout);
                this.achToastTimeout = setTimeout(() => toast.classList.add('hidden'), 3500);

                this.saveGame();
                this.updateUI();
            }

            updateUI() {
                this.drawStatIcons();
                const pet = this.getActivePet();

                document.getElementById('petCountLabel').innerText = this.isWaitingEgg ? '---' : `${this.activePetIndex + 1}/${this.pets.length}`;

                document.getElementById('achTracker').innerText = `🏆 ${Object.keys(this.achievements.unlocked).length}/${ACHIEVEMENTS.length}`;

                document.getElementById('coinTracker').innerText = `🪙 ${Math.floor(this.coins)}`;

                const prevBtn = document.getElementById('petNavPrev');
                const nextBtn = document.getElementById('petNavNext');
                const isOverlayScreen = this.miniGameActive || this.shopScreenOpen || this.achScreenOpen || this.treeScreenOpen;

                if (!isOverlayScreen && this.pets.length > 1) {
                    prevBtn.classList.toggle('hidden', this.activePetIndex <= 0);
                    nextBtn.classList.toggle('hidden', this.activePetIndex >= this.pets.length - 1);
                } else {
                    if (!prevBtn.classList.contains('hidden')) prevBtn.classList.add('hidden');
                    if (!nextBtn.classList.contains('hidden')) nextBtn.classList.add('hidden');
                }

                if (!pet) return;

                this.normalizeMenuSelection();

                document.getElementById('petNameStage').innerText = `${pet.name} · ${pet.stage}`;
                document.getElementById('genTracker').innerText = `GEN ${pet.generation}`;

                [['barHunger', pet.hunger], ['barHappy', pet.happiness], ['barEnergy', pet.energy], ['barHygiene', pet.hygiene], ['barHealth', pet.health]].forEach(([id, value]) => {
                    const fill = document.getElementById(id);
                    fill.style.width = (Math.round(value / 10) * 10) + '%';
                    fill.closest('.stat-item').classList.toggle('stat-critical', value < 30);
                });

                if (pet.stage === 'DEAD') {
                    const toyLoss = pet.toys && pet.toys.length ? ` I suoi toy sono andati perduti con lui.` : '';
                    this.showModal("PET DECEDUTO", `Il tuo pet è morto per negligenza.${toyLoss} Un nuovo uovo apparirà tra poco...`, () => {
                        this.archivePet(pet, 'DEAD');
                        this.pets.splice(this.activePetIndex, 1);
                        if (this.pets.length === 0) {
                            this.startEggWaiting();
                        } else {
                            this.activePetIndex = 0;
                            this.saveGame();
                        }
                    });
                }
            }

            showModal(title, text, onConfirm = null) {
                const modal = document.getElementById('overlayModal');
                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalBody').innerText = text;
                modal.classList.remove('hidden');

                this.modalConfirmCallback = onConfirm;
            }

            closeModal() {
                document.getElementById('overlayModal').classList.add('hidden');
                if (this.modalConfirmCallback) {
                    this.modalConfirmCallback();
                    this.modalConfirmCallback = null;
                }
            }

            startEggWaiting(delayMs) {
                this.pets = [];
                this.activePetIndex = 0;
                this.isWaitingEgg = true;
                this.petHistory = []; // estinzione: l'albero della dinastia si azzera

                if (this.eggWaitTimeout) clearTimeout(this.eggWaitTimeout);
                if (delayMs === undefined || delayMs === null || isNaN(delayMs)) {
                    delayMs = randRange(CONFIG.eggSpawn) * 1000;
                }
                this.nextEggAt = Date.now() + delayMs;

                this.hideEggBanner();

                this.eggWaitTimeout = setTimeout(() => this.eggFound(), delayMs);

                this.saveGame();
                this.updateUI();
                this.updateNotifications();
            }

            eggFound() {
                this.eggWaitTimeout = null;
                this.isWaitingEgg = false;
                this.nextEggAt = null;

                this.pets = [new Pet({ name: '???', generation: 1 })];
                this.activePetIndex = 0;
                this.totalPetsRaised = 1;

                this.showEggBanner();

                this.saveGame();
                this.updateUI();
            }

            showEggBanner(text = 'Hai trovato un uovo!') {
                const banner = document.getElementById('eggFoundBanner');
                document.getElementById('eggBannerText').innerText = text;
                if (this.eggBannerTimeout) clearTimeout(this.eggBannerTimeout);
                banner.classList.remove('hidden');
                audio.playChime();
                this.eggBannerTimeout = setTimeout(() => this.hideEggBanner(), CONFIG.ui.eggBannerSeconds * 1000);
            }

            hideEggBanner() {
                if (this.eggBannerTimeout) {
                    clearTimeout(this.eggBannerTimeout);
                    this.eggBannerTimeout = null;
                }
                document.getElementById('eggFoundBanner').classList.add('hidden');
            }

            saveGame() {
                const data = {
                    pets: this.pets,
                    activePetIndex: this.activePetIndex,
                    totalPetsRaised: this.totalPetsRaised,
                    highestGen: this.highestGen,
                    petHistory: this.petHistory,
                    isWaitingEgg: this.isWaitingEgg,
                    nextEggAt: this.nextEggAt,
                    coins: this.coins,
                    achievements: this.achievements.serialize(),
                    petMemories: this.petAI ? this.petAI.serializeMemories() : {},
                    petShortTerm: this.petAI ? this.petAI.serializeShortTerm() : {}
                };
                localStorage.setItem('pocket_pet_save_v1', JSON.stringify(data));
            }

            loadGame() {
                const saved = localStorage.getItem('pocket_pet_save_v1');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        this.achievements.deserialize(parsed.achievements);
                        if (parsed.isWaitingEgg || !parsed.pets || parsed.pets.length === 0) {
                            const remaining = (parsed.isWaitingEgg && parsed.nextEggAt) ? Math.max(0, parsed.nextEggAt - Date.now()) : undefined;
                            this.startEggWaiting(remaining);
                        } else {
                            this.pets = parsed.pets.map(pData => new Pet(pData));
                            this.activePetIndex = Math.min(parsed.activePetIndex || 0, this.pets.length - 1);
                            this.totalPetsRaised = parsed.totalPetsRaised || this.pets.length;
                            this.highestGen = parsed.highestGen || 1;
                            this.petHistory = Array.isArray(parsed.petHistory) ? parsed.petHistory : [];
                            this.coins = typeof parsed.coins === 'number' ? parsed.coins : 0;
                            // Le memorie vengono caricate dopo l'inizializzazione del PetAI
                            this._pendingMemories = parsed.petMemories || {};
                            this._pendingShortTerm = parsed.petShortTerm || {};
                        }
                    } catch(e) {
                        this.startEggWaiting();
                    }
                } else {
                    this.startEggWaiting();
                }
            }
        }

        window.addEventListener('load', () => {
            window.tamaEngine = new WidgetEngine();
        });
    </script>

    <script type="module">
        import { PetAI } from './tools/pet-ai.js';
        import { SpeechRecognizer } from './tools/speech-recognizer.js';
        import { PetSynth } from './tools/pet-synth.js';
        import {
            LLM_MODELS,
            getSavedModelId,
            saveModelId,
        } from './tools/local-llm-engine.js';

        function initPetAI() {
            const engine = window.tamaEngine;
            if (!engine) {
                setTimeout(initPetAI, 200);
                return;
            }

            const petAI = new PetAI({
                modelId: getSavedModelId(),
                maxCacheSize: 5,
            });

            engine.petAI = petAI;

            // Restore the saved memories before init runs.
            if (engine._pendingMemories) {
                petAI.deserializeMemories(engine._pendingMemories);
                delete engine._pendingMemories;
            }
            if (engine._pendingShortTerm) {
                petAI.deserializeShortTerm(engine._pendingShortTerm);
                delete engine._pendingShortTerm;
            }

            petAI.addEventListener('statuschange', (e) => {
                console.log('[PetAI] Status:', e.detail);
                // When the model becomes ready, greet with a fresh line
                // (replaces any pre-written phrase shown during loading).
                if (e.detail === 'ready') {
                    const pet = engine.getActivePet();
                    if (pet && pet.canAct() && !engine.speechGenerating) {
                        engine.startLiveSpeech(pet, {
                            event: { type: 'GREET', detail: 'The user just opened the game and came to see you. Greet them in one short, warm line and ask how their day is going.' }
                        });
                    }
                    // Hide the settings modal loading hint if it's open.
                    const statusHint = document.getElementById('modelStatusHint');
                    if (statusHint) statusHint.textContent = '';
                }
            });

            // Surface fallback events: the initial model crashed and the
            // engine auto-selected a lighter tier. Inform the user.
            petAI.addEventListener('fallback', (e) => {
                console.warn(`[PetAI] Initial model failed; using "${e.detail.label}".`);
                const statusHint = document.getElementById('modelStatusHint');
                if (statusHint) {
                    statusHint.textContent = `Auto-switched to ${e.detail.label} (initial model too heavy).`;
                }
            });

            // First speech: fallback until the model is loaded.
            setTimeout(() => {
                const pet = engine.getActivePet();
                if (pet && pet.canAct() && !engine.speechGenerating) {
                    engine.applyPetVoice();
                    if (petAI.ready) {
                        engine.startLiveSpeech(pet, {
                            event: { type: 'GREET', detail: 'The user just opened the game and came to see you. Greet them in one short, warm line and ask how their day is going.' }
                        });
                    } else {
                        engine.petSpeech = petAI.getFallbackPhrase(pet);
                        engine.speechTimer = engine.speechShowDuration;
                        engine.speechOpacity = 0;
                    }
                }
            }, 2000);

            petAI.init();

            // === Settings Modal: AI model picker ===
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsModal = document.getElementById('settingsModal');
            const modelSelect = document.getElementById('modelSelect');
            const modelVramHint = document.getElementById('modelVramHint');
            const settingsReloadBtn = document.getElementById('settingsReloadBtn');
            const settingsSaveBtn = document.getElementById('settingsSaveBtn');
            const settingsCancelBtn = document.getElementById('settingsCancelBtn');

            if (modelSelect) {
                for (const m of LLM_MODELS) {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = `${m.label} (${m.vram})`;
                    modelSelect.appendChild(opt);
                }
                modelSelect.value = petAI.modelId;
                const syncHint = () => {
                    const sel = LLM_MODELS.find((m) => m.id === modelSelect.value);
                    if (modelVramHint) modelVramHint.textContent = sel ? `VRAM stimata: ${sel.vram}` : '';
                };
                modelSelect.addEventListener('change', syncHint);
                syncHint();
            }

            function closeSettings() { if (settingsModal) settingsModal.classList.add('hidden'); }
            function openSettings() {
                if (!settingsModal || !modelSelect) return;
                modelSelect.value = petAI.modelId;
                const sel = LLM_MODELS.find((m) => m.id === modelSelect.value);
                if (modelVramHint && sel) modelVramHint.textContent = `VRAM stimata: ${sel.vram}`;
                settingsModal.classList.remove('hidden');
            }

            async function reloadPetAI(newId) {
                try {
                    if (settingsReloadBtn) settingsReloadBtn.disabled = true;
                    if (settingsSaveBtn) settingsSaveBtn.disabled = true;
                    await petAI.unload();
                    petAI.modelId = newId;
                    const statusHint = document.getElementById('modelStatusHint');
                    if (statusHint) statusHint.textContent = 'Loading new model...';
                    await petAI.init();
                    if (statusHint) statusHint.textContent = '';
                } catch (err) {
                    console.warn('[Settings] Reload failed:', err.message);
                    const statusHint = document.getElementById('modelStatusHint');
                    if (statusHint) statusHint.textContent = `Reload failed: ${err.message}`;
                } finally {
                    if (settingsReloadBtn) settingsReloadBtn.disabled = false;
                    if (settingsSaveBtn) settingsSaveBtn.disabled = false;
                }
            }

            if (settingsBtn) settingsBtn.addEventListener('click', openSettings);
            if (settingsCancelBtn) settingsCancelBtn.addEventListener('click', closeSettings);
            if (settingsSaveBtn) {
                settingsSaveBtn.addEventListener('click', () => {
                    const newId = modelSelect.value;
                    saveModelId(newId);
                    closeSettings();
                });
            }
            if (settingsReloadBtn) {
                settingsReloadBtn.addEventListener('click', async () => {
                    const newId = modelSelect.value;
                    saveModelId(newId);
                    await reloadPetAI(newId);
                });
            }

            // === Speech Recognizer (STT) — English stack ===
            const recognizer = new SpeechRecognizer({ lang: "en-US", continuous: false });
            engine.speechRecognizer = recognizer;
            recognizer.loadSavedDevice();

            // === Pet Synth (TTS) — English stack ===
            const synth = new PetSynth({ lang: "en-US", rate: 0.9 });
            engine.petSynth = synth;

            // === Mic (azione nel menu) ===
            if (recognizer.isSupported()) {
                recognizer.addEventListener('start', () => {
                    engine.isListening = true;
                    // Show "Speak now..." in the bubble.
                    const pet = engine.getActivePet();
                    if (pet && pet.canAct()) {
                        engine.userInputSpeech = null;
                        engine.petSpeech = '🎤 Speak now...';
                        engine.speechTimer = 300;
                        engine.speechOpacity = 0;
                    }
                });

                recognizer.addEventListener('end', () => {
                    engine.isListening = false;
                });

                recognizer.addEventListener('retry', (e) => {
                    const { attempt, maxRetries } = e.detail;
                    console.warn(`[STT] Riconnessione... tentativo ${attempt}/${maxRetries}`);
                    engine.petSpeech = `🔄 Riconnessione... (${attempt}/${maxRetries})`;
                    engine.speechTimer = 120;
                    engine.speechOpacity = 0;
                });

                recognizer.addEventListener('error', (e) => {
                    console.warn('[STT] Errore:', e.detail.message);
                    engine.isListening = false;
                    if (e.detail.error === 'not-allowed') {
                        engine.petSpeech = 'Permesso microfono negato';
                        engine.speechTimer = 180;
                        engine.speechOpacity = 0;
                    } else if (e.detail.error === 'network') {
                        engine.petSpeech = '❌ Errore di rete - controlla la connessione';
                        engine.speechTimer = 240;
                        engine.speechOpacity = 0;
                    }
                });

                recognizer.addEventListener('result', (e) => {
                    const { transcript, isFinal } = e.detail;

                    if (!isFinal) {
                        // Mostra il testo in tempo reale
                        engine.petSpeech = `🎤 "${transcript}"`;
                        engine.speechTimer = 300;
                        engine.speechOpacity = 1;
                        return;
                    }

                    // Testo finale: processa
                    engine.petSpeech = `"${transcript}"`;
                    engine.speechTimer = 120;
                    engine.speechOpacity = 1;

                    const pet = engine.getActivePet();
                    if (!pet || !pet.canAct()) return;

                    // Genera la risposta in streaming: salva anche la memoria.
                    // Il TTS è gestito internamente da startLiveSpeech.
                    engine.startLiveSpeech(pet, {
                        userText: transcript
                    });
                });
            }

            // Ferma TTS quando il bubble scompare
            const origSpeechCheck = engine.update.bind(engine);
            // Aggiunge controllo TTS nel game loop (sopra la riga 1710)
        }

        if (document.readyState === 'complete') {
            initPetAI();
        } else {
            window.addEventListener('load', () => setTimeout(initPetAI, 500));
        }
    </script>
